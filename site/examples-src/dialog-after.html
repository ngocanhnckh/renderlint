<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project settings</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f4f4f5}main{max-width:960px;margin:0 auto;padding:24px}h1{font-size:22px;margin:0 0 16px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:16px 18px}
button{font:inherit;padding:10px 16px;min-height:44px;border-radius:8px;border:1px solid #a1a1aa;background:#fff;color:#18181b;cursor:pointer}.danger{background:#b91c1c;color:#fff;border-color:#b91c1c} dialog{border:0;border-radius:14px;padding:22px;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(24,24,27,.5)}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.notice{margin:0 0 16px;padding:10px 14px;border-radius:10px;background:#fef3c7;color:#713f12}</style></head><body><main><h1>Project settings</h1><p class="notice" role="status">Your trial ends in 3 days.</p><section class="card"><h2 style="margin:0 0 6px;font-size:16px">Delete project</h2><p style="margin:0 0 12px;color:#3f3f46">Removes the project and its 214 deployments.</p><button class="danger" id="del">Delete project</button></section></main>
<dialog id="confirm" aria-labelledby="ct"><h2 id="ct" style="margin:0 0 6px;font-size:18px">Delete this project?</h2><p style="margin:0;color:#3f3f46">This removes 214 deployments and can't be undone.</p><form method="dialog" class="row"><button value="cancel" autofocus>Cancel</button><button value="delete" class="danger">Delete project</button></form></dialog>
<script>
const dlg=document.getElementById("confirm");
document.getElementById("del").addEventListener("click",()=>dlg.showModal());
dlg.addEventListener("close",()=>{if(dlg.returnValue==="delete")fetch("/api/projects/42",{method:"DELETE"});});
</script></body></html>
