<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="no-warn" content="cramped-control,label-in-name,aria-reference"><title>Controls</title><style>body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#111827;background:#fff}main{max-width:760px;margin:0 auto;padding:24px}button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #1d4ed8;background:#1d4ed8;color:#fff}.ghost{background:#fff;color:#111827;border-color:#9ca3af}.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.group{display:inline-flex}.group button{border-radius:0;margin-left:-1px}.group button:first-child{border-radius:8px 0 0 8px}.group button:last-child{border-radius:0 8px 8px 0}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid #d4d4d8;border-radius:8px;background:#f4f4f5}.seg button{border:0;border-radius:6px;background:transparent;color:#111827;padding:4px 10px}.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 2px #0003}
.card{border:1px solid #d1d5db;border-radius:10px;padding:16px;margin:12px 0}.card .full{display:block;width:calc(100% + 32px);margin:16px -16px -16px;border-radius:0 0 10px 10px}
.ig{display:flex}.ig input{flex:1;min-width:0;padding:8px;font:inherit;border:1px solid #9ca3af;border-radius:8px 0 0 8px}.ig button{border-radius:0 8px 8px 0}
.toolbar{display:flex;gap:2px}.toolbar button{background:transparent;border:0;color:#111827;padding:6px 10px}.tabs{display:flex;gap:16px;border-bottom:1px solid #e5e7eb}.tabs button{background:none;color:#111827;border:0;border-radius:0;padding:0 0 8px;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{border-bottom-color:#1d4ed8}p a.hl{box-shadow:inset 0 -2px 0 #fbbf24;color:#111827;text-decoration:none}</style></head><body><main><h1>Controls</h1><div class="row"><button class="ghost">Cancel</button><button>Save</button></div>
<div class="group"><button class="ghost">Day</button><button class="ghost">Week</button><button class="ghost">Month</button></div>
<div class="row"><div class="seg" role="group" aria-label="Range"><button aria-pressed="true">3M</button><button aria-pressed="false">6M</button><button aria-pressed="false">12M</button></div></div>
<div class="card"><p style="margin:0">Pro plan, billed monthly.</p><button class="full">Upgrade</button></div>
<div class="ig"><input aria-label="Search" placeholder="Search"><button>Go</button></div>
<div class="toolbar"><button aria-label="Bold">B</button><button aria-label="Italic">I</button></div>
<p><button aria-label="Place order, total $42">Place order</button> <button aria-label="Close">×</button> <a href="/inbox" aria-label="Inbox, 3 unread">Inbox <span>3</span></a></p>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true">Overview</button><button role="tab" aria-selected="false">Activity</button></div><p>Read the <a class="hl" href="/guide">setup guide</a> first.</p><p><button aria-label="Go back"><span class="material-icons">arrow_back</span></button></p><span id="lbl">Email</span><input aria-labelledby="lbl" style="display:block;padding:8px;margin:8px 0"></main></body></html>
