<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recent orders</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f4f4f5}main{max-width:960px;margin:0 auto;padding:24px}h1{font-size:22px;margin:0 0 16px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:16px 18px}
table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;padding:10px 6px;overflow-wrap:anywhere;border-bottom:1px solid #f4f4f5}th{font-size:12px;color:#52525b;font-weight:600;overflow-wrap:normal}.bone{height:18px;margin:12px 0;border-radius:6px;background:#e4e4e7}</style></head><body><main><h1>Dashboard</h1><section class="card"><h2 style="margin:0 0 8px;font-size:16px">Recent orders</h2><div id="orders" aria-busy="true"><div class="bone"></div><div class="bone"></div><div class="bone"></div><div class="bone"></div><div class="bone"></div></div></section></main>
<script>const box=document.getElementById("orders");fetch("orders.json").then((r)=>{if(!r.ok)throw new Error(r.status);return r.json();}).then((rows)=>{box.innerHTML='<table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>'+rows.map((o)=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.total}</td><td>${o.status}</td></tr>`).join("")+'</tbody></table>';}).catch(()=>{box.innerHTML='<p role="alert">Orders could not be loaded. <button onclick="location.reload()">Try again</button></p>';}).finally(()=>box.removeAttribute("aria-busy"));</script></body></html>
