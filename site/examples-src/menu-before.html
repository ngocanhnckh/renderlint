<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f4f4f5}main{max-width:960px;margin:0 auto;padding:24px}h1{font-size:22px;margin:0 0 16px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:16px 18px}
.cards{display:grid;gap:16px}.card{position:relative}.card h2{margin:0 0 10px;font-size:16px}.dd{position:relative;display:inline-block}button{font:inherit;padding:8px 14px;min-height:40px;background:#fff;color:#18181b;border:1px solid #a1a1aa;border-radius:8px;cursor:pointer}[role=menu]{position:absolute;top:100%;left:0;z-index:50;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid #d4d4d8;border-radius:8px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.12)}[role=menuitem]{display:block;width:100%;text-align:left;border:0;padding:8px 10px;min-height:36px;background:none}[hidden]{display:none!important} .clip{overflow:hidden;height:96px}.stack{z-index:1}.stack+.stack{z-index:2}</style></head><body><main><h1>Workspace</h1><div class="cards"><section class="card clip"><h2>Billing</h2><div class="dd"><button aria-haspopup="menu" aria-expanded="false" aria-controls="m1">Billing actions</button><ul role="menu" id="m1" hidden><li><button role="menuitem">Download invoice</button></li><li><button role="menuitem">Change plan</button></li><li><button role="menuitem">Update card</button></li></ul></div></section><section class="card stack"><h2>Team</h2><div class="dd"><button aria-haspopup="menu" aria-expanded="false" aria-controls="m2">Team actions</button><ul role="menu" id="m2" hidden><li><button role="menuitem">Invite people</button></li><li><button role="menuitem">Manage roles</button></li><li><button role="menuitem">Export members</button></li></ul></div></section><section class="card stack" style="height:180px"><h2>Usage this month</h2><p style="margin:0;color:#3f3f46">12,480 API calls of 50,000.</p></section></div><p style="height:240px"></p></main><script>document.addEventListener("click",(e)=>{const t=e.target.closest("[aria-haspopup]");document.querySelectorAll("[aria-haspopup][aria-expanded=true]").forEach((o)=>{if(o!==t){o.setAttribute("aria-expanded","false");document.getElementById(o.getAttribute("aria-controls")).hidden=true;}});if(t){const m=document.getElementById(t.getAttribute("aria-controls"));const open=m.hidden;m.hidden=!open;t.setAttribute("aria-expanded",String(open));}});</script></body></html>
