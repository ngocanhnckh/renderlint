# Tests and the dist/ freshness check, in Playwright's image (Chromium and its system libraries included).
# Keep the image tag in step with the playwright version in package.json.
test:
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git)
    - npm ci
    - node scripts/build-client.js && git diff --exit-code dist/
    - npm test
