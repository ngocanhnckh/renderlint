<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="no-warn" content="tooltip-keyboard"><title>Tooltips</title><style>body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#111827;background:#fff}main{max-width:760px;margin:0 auto;padding:24px}button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #1d4ed8;background:#1d4ed8;color:#fff}.ghost{background:#fff;color:#111827;border-color:#9ca3af}.tipwrap{position:relative;display:inline-block;margin:60px 40px 0}.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:6px 10px;border-radius:6px;white-space:nowrap;display:none}.tipwrap:hover .tip,.tipwrap:focus-within .tip{display:block}.tipwrap.closed .tip{display:none}</style></head><body><main><h1>Tooltips</h1><span class="tipwrap"><button aria-label="Download" aria-describedby="t1"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v9M4 7l4 4 4-4" stroke="#fff" fill="none"/></svg></button><span role="tooltip" id="t1" class="tip">Download files</span></span></main><script>document.addEventListener("keydown",(e)=>{if(e.key==="Escape")document.querySelectorAll(".tipwrap").forEach((w)=>w.classList.add("closed"))});document.querySelectorAll(".tipwrap").forEach((w)=>{w.addEventListener("mouseenter",()=>w.classList.remove("closed"));w.addEventListener("focusin",()=>w.classList.remove("closed"))})</script></body></html>
