<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Intentional</title>
<style>body{font-family:sans-serif;margin:0;padding:16px;color:#111;background:#fff}
.watermark{color:#f0f0f0;font-size:14px;--renderlint-ignore: contrast}
.chat .msg{max-width:300px}
.box{width:220px;height:40px;overflow:hidden;border:1px solid #ccc}</style></head><body>
<p class="watermark">Draft — internal preview</p>
<div class="chat" data-renderlint-ignore="emoji" data-renderlint-reason="user-generated chat content"><p class="msg">Sounds great 🎉 see you there 👋</p></div>
<div class="box" data-renderlint-ignore data-renderlint-reason="teaser, expands on click">A long teaser text that is cut off on purpose because the card expands when you click it to reveal everything.</div>
</body></html>
