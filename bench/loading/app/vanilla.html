<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders (vanilla)</title>
<link rel="stylesheet" href="/src/app.css">
</head>
<body>
<div class="app"><aside class="side"><b>Acme</b><span>Dashboard</span><span>Orders</span><span>Settings</span></aside>
<main class="main"><h1>Orders</h1><div class="card"><table class="tbl"><tbody id="rows"></tbody></table></div></main></div>
<script>
fetch('/api/orders').then((r) => r.json()).then((d) => {
  document.getElementById('rows').innerHTML = d.items.map((o) => `<tr><td>#${o.id}</td><td>${o.customer}</td><td>${o.total}</td><td>${o.status}</td></tr>`).join('');
});
</script>
</body>
</html>
