<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="expect" content="zoom-disabled"><meta name="expect-warn" content="input-zoom,html-lang"><title>Sign up</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#111827;background:#fff}main{max-width:420px;margin:0 auto;padding:24px 16px}
label{display:block;margin:12px 0 4px;font-size:14px}input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #9ca3af;border-radius:8px;font:14px system-ui,sans-serif}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font:600 16px system-ui}</style></head><body>
<!-- No lang on <html>; zoom turned off to stop iPhones zooming into the 14px fields. -->
<main><h1>Create your account</h1>
<label for="email">Email</label><input id="email" type="email" placeholder="you@example.com">
<label for="note">Anything else?</label><textarea id="note" rows="3" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #9ca3af;border-radius:8px;font:14px system-ui,sans-serif"></textarea>
<button>Continue</button></main></body></html>
