<!doctype html><html lang="en" data-router="hash"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Demo app</title>
<style>
body{font-family:sans-serif;margin:0;color:#18181b;background:#fff}
nav{display:flex;gap:16px;padding:12px 24px;border-bottom:1px solid #e4e4e7}
nav a{color:#1d4ed8;padding:12px 4px}
main{padding:24px;max-width:640px}
form{display:grid;gap:16px;max-width:320px}
label{display:grid;gap:4px}
input{font:inherit;padding:10px 12px;border:1px solid #71717a;border-radius:6px}
button{font:inherit;padding:10px 16px;border:0;border-radius:6px;background:#1d4ed8;color:#fff}
.error{color:#b91c1c;margin:0}
.card{border:1px solid #d4d4d8;border-radius:12px;padding:16px}
/* Defect only the signed-in dashboard shows: the badge is too narrow for its label. */
.badge{display:inline-block;width:90px;white-space:nowrap;padding:4px 8px;border-radius:999px;background:#ede9fe;color:#5b21b6}
</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>
