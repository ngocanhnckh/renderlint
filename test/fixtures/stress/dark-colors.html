<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>t</title>
<style>:root{--bg:#fff;--fg:#111;--line:#ccc}
@media (prefers-color-scheme: dark){:root{--bg:#111;--fg:#eee;--line:#444}.card{background:#1c1c1c}}
body{font-family:sans-serif;margin:0;padding:16px;color:var(--fg);background:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(3,180px);gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fafafa}
.card b{display:block}</style></head><body>
<!-- Dark mode only changes colors: the dark run reuses the light stress findings. -->
<div class="cards">
  <div class="card"><b>Northwind</b><span class="email">it@acme.io</span></div>
  <div class="card"><b>Lumen</b><span class="email">ops@lumen.app</span></div>
  <div class="card"><b>Acme</b><span class="email">hi@acme.com</span></div>
</div>
</body></html>
